name: Tests
on:
  pull_request:
  push:
    branches:
    - main
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  tests:
    timeout-minutes: 30
    permissions:
      contents: read
    name: "Test"
    runs-on: "ubuntu-26.04"
    steps:
    - name: "Check out source code"
      uses: "actions/checkout@v7.0.1"
      with:
        persist-credentials: false
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
        cache-python: true
        cache-dependency-glob: |
          uv.lock
          .python-version
        version: latest
    - name: Install normalization test tools
      run: sudo apt-get update && sudo apt-get install -y ffmpeg p7zip-full
    - name: Run tests
      run: ./test.sh
    - name: "Upload coverage report"
      if: ${{ github.repository == 'artefactual-labs/a3m' }}
      uses: "codecov/codecov-action@v7.1.1"
      with:
        files: ./coverage.xml
        disable_search: true
        plugins: noop
        # Coverage and test reports use the existing repository token.
        # jactionlint ignore=secrets-outside-env
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Upload test results to Codecov
      if: ${{ !cancelled() && github.repository == 'artefactual-labs/a3m' }}
      uses: codecov/codecov-action@v7.1.1
      with:
        files: ./junit.xml
        report_type: test_results
        disable_search: true
        plugins: noop
        # Coverage and test reports use the existing repository token.
        # jactionlint ignore=secrets-outside-env
        token: ${{ secrets.CODECOV_TOKEN }}
  e2e:
    timeout-minutes: 30
    permissions:
      contents: read
    name: "Run E2E tests"
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1
    - name: Build and cache
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        tags: a3m:acceptance
        push: false
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Export image for Dagger
      run: docker save --output /tmp/a3m-acceptance.tar a3m:acceptance
    - name: Run acceptance scenarios
      uses: dagger/dagger-for-github@v8.4.1
      with:
        version: v0.21.11
        call: >-
          acceptance --image=/tmp/a3m-acceptance.tar
          export --path=acceptance/reports
    - name: Check acceptance result
      run: test "$(cat acceptance/reports/exit-code.txt)" = "0"
    - name: Upload acceptance reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7.0.2
      with:
        name: acceptance-reports
        path: acceptance/reports
        if-no-files-found: warn
        retention-days: 7
