name: Tests
on:
  pull_request:
  push:
    branches:
    - main
jobs:
  tests:
    name: "Test"
    runs-on: "ubuntu-26.04"
    steps:
    - name: "Check out source code"
      uses: "actions/checkout@v4"
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        cache-python: true
        cache-dependency-glob: |
          uv.lock
          .python-version
        version: latest
    - name: Install normalization test tools
      run: sudo apt-get update && sudo apt-get install -y ffmpeg p7zip-full
    - name: Run tests
      run: ./test.sh
    - name: "Upload coverage report"
      if: github.repository == 'artefactual-labs/a3m'
      uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1
      with:
        files: ./coverage.xml
        disable_search: true
        plugins: noop
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Upload test results to Codecov
      if: ${{ !cancelled() && github.repository == 'artefactual-labs/a3m' }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./junit.xml
        report_type: test_results
        disable_search: true
        plugins: noop
        token: ${{ secrets.CODECOV_TOKEN }}
  e2e:
    name: "Run E2E tests"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build and cache
      uses: docker/build-push-action@v5
      with:
        context: .
        tags: a3m:latest
        push: false
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Run test
      run: |
        docker image ls
        docker run \
          --rm \
          --entrypoint=python \
          --env=A3M_DEBUG=yes \
            a3m:latest \
              -m a3m.cli.client \
                --name=MARBLES \
                https://github.com/artefactual/archivematica-sampledata/raw/master/SampleTransfers/Images/pictures/MARBLES.TGA
