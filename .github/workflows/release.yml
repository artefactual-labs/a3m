name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-package:
    name: Build Python package
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
    - name: "Check out source code"
      uses: "actions/checkout@v7.0.1"
      with:
        persist-credentials: false
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: false
        version: latest
    - name: Build package
      run: uv build
    - name: Store distribution packages
      uses: actions/upload-artifact@v7.0.2
      with:
        name: python-distributions
        path: dist/
        if-no-files-found: error
  pypi:
    name: Publish Python package
    needs: build-package
    timeout-minutes: 10
    permissions:
      # Authenticate to PyPI through trusted publishing.
      id-token: write
    runs-on: ubuntu-26.04
    environment: release
    steps:
    - name: Download distribution packages
      uses: actions/download-artifact@v8.0.2
      with:
        name: python-distributions
        path: dist/
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: false
        version: "0.13.6"
        python-version: "3.12.16"
    - name: Attest distribution packages
      run: >-
        uvx --exclude-newer=2026-10-29T00:00:00Z
        --from pypi-attestations==0.0.30
        python -m pypi_attestations sign dist/*
    - name: Upload distribution packages to PyPI
      run: uv publish --trusted-publishing always
  docker:
    name: Publish container image
    timeout-minutes: 30
    permissions:
      contents: read
      # Publish release images to GHCR.
      packages: write
    runs-on: ubuntu-26.04
    environment: release
    steps:
    - name: "Check out source code"
      uses: "actions/checkout@v7.0.1"
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Capture Docker metadata
      id: meta
      uses: docker/metadata-action@v6.2.0
      with:
        images: |
          ghcr.io/artefactual-labs/a3m
        tags: |
          type=semver,pattern={{raw}}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1
      with:
        cache-binary: false
    - name: Log in to the container registry
      uses: docker/login-action@v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v7.4.0
      with:
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: BUILDKIT_CONTEXT_KEEP_GIT_DIR=true
