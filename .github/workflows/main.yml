name: Build main image
on:
  push:
    branches:
    - main
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build main image
    timeout-minutes: 30
    permissions:
      contents: read
      # Publish the main image to GHCR.
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    runs-on: ubuntu-26.04
    steps:
    - name: Check out source code
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1
      with:
        cache-binary: false
    - name: Log in to the container registry
      uses: docker/login-action@v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker image
      id: image
      # Only trusted main builds populate this scope; PR builds use another scope.
      # jactionlint ignore=cache-poisoning
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        push: true
        tags: ghcr.io/artefactual-labs/a3m:main
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=https://github.com/artefactual-labs/a3m
        cache-from: type=gha,scope=main
        cache-to: type=gha,mode=max,scope=main
  sbom:
    name: Inventory main dependencies
    needs: build
    permissions:
      contents: read
    uses: $/.github/workflows/sbom.yml
    with:
      source-ref: ${{ github.sha }}
      project-version: main
      image: ghcr.io/artefactual-labs/a3m@${{ needs.build.outputs.digest }}
    secrets:
      # Shared organization/repository credentials, as in the other projects.
      # jactionlint ignore=secrets-outside-env
      DEPENDENCY_TRACK_URL: ${{ secrets.DEPENDENCY_TRACK_URL }}
      # jactionlint ignore=secrets-outside-env
      DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
